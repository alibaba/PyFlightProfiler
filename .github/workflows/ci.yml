name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          # A commit-time guard, not a code-quality check: CI is meant to run
          # against main.
          SKIP: no-commit-to-branch

  unit:
    # Fast feedback across every interpreter the package claims to support.
    # These tests need neither the C extensions nor the agent library, so they
    # run in seconds without the full build -- the integration job below still
    # covers the compiled paths.
    name: Unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # pympler and pystack are imported lazily inside the plugins that use
        # them, so the unit suite needs nothing but pytest.
        run: pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest flight_profiler/test -q

  test:
    name: Integration (Rocky Linux 8, Python 3.10)
    # Rocky Linux 8 (CentOS 8 compatible), glibc 2.28
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            gcc-c++ \
            make \
            wget \
            xz \
            curl \
            git \
            unzip \
            which \
            findutils

      - name: Check glibc version
        run: |
          ldd --version | head -n1
          # Should show glibc 2.28 (within 2.17-2.32 range)

      - name: Install Miniforge
        run: |
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
          bash miniforge.sh -b -p $HOME/miniforge
          echo "$HOME/miniforge/bin" >> $GITHUB_PATH

      - name: Setup Conda environment
        run: |
          export PATH="$HOME/miniforge/bin:$PATH"
          conda create -n test python=3.10 -y
          conda init bash
          echo "conda activate test" >> ~/.bashrc

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poetry and dependencies
        shell: bash -l {0}
        run: |
          source $HOME/miniforge/bin/activate test
          pip install --upgrade pip
          pip install poetry pytest
          poetry config virtualenvs.create false
          poetry install --no-interaction --without dev

      - name: Run tests
        shell: bash -l {0}
        run: |
          source $HOME/miniforge/bin/activate test
          export PYTHON_HEADER_PATH=$HOME/miniforge/envs/test/include/python3.10
          make test
